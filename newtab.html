<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>New Tab</title>
  <link rel="stylesheet" href="./assets/css/newtab.css">
</head>
<body>
<div class="search-container">
  <input type="text" id="searchInput" placeholder="Tìm kiếm trên Google...">
</div>
<div class="container">
  <div class="widget clock">
    <div class="clock-time" id="time">12:34:56</div>
    <div id="date">Thứ Hai, 13 Tháng Tư, 2025</div>
    <div id="lunar-date">Ngày 15 Tháng Ba, Ất Tỵ</div>
  </div>
  <div class="widget calendar">
    <div id="calendar">
      <h3 id="calendar-title">Tháng Tư 2025</h3>
      <div class="calendar-grid" id="calendar-grid">
        <!-- Calendar will be generated by JavaScript -->
      </div>
    </div>
  </div>
  <div class="widget todo">
    <h3>Todo List</h3>
    <input type="text" id="todoInput" placeholder="Thêm công việc mới...">
    <ul id="todoList">
      <li>Mẫu task 1<button>X</button></li>
      <li>Mẫu task 2<button>X</button></li>
    </ul>
  </div>
  <div class="widget video">
    <div class="video-container">
      <video autoplay muted id="myVideo">
        <source src="./assets/videos/h0001.mp4" type="video/mp4" id="videoSource">
        Your browser does not support the video tag.
      </video>
    </div>
  </div>
  <div class="widget vocabulary">
    <h3>Word Quiz</h3>
    <div class="vocab-content">
      <div id="vocab-word">Serendipity</div>
      <div class="vocab-options">
        <button id="vocab-option-a" data-option="A">A: May mắn tình cờ</button>
        <button id="vocab-option-b" data-option="B">B: Buồn bã</button>
        <button id="vocab-option-c" data-option="C">C: Hùng biện</button>
      </div>
      <div id="vocab-feedback" style="display: none;"></div>
      <button id="vocab-play">🔊 Play</button>
      <button id="vocab-save" style="display: none;">💾 Save</button>
      <button id="vocab-next" style="display: none;">Next</button>
    </div>
  </div>
  <div class="widget phrase">
    <h3>Phrase of the Day</h3>
    <div class="phrase-content">
      <div id="phrase-text">Can you give me a hand?</div>
      <div id="phrase-meaning">Giúp tôi một tay nhé?</div>
      <div id="phrase-context">Use when asking for help with something small.</div>
      <button id="phrase-play">🔊 Play</button>
      <button id="phrase-save">💾 Save</button>
    </div>
  </div>
</div>

<script src="assets/scripts/luna.js"></script>
<script src="assets/scripts/newtab.js"></script>
</body>
</html>
